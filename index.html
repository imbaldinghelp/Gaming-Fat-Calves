<title>Haze Heroes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=IBM+Plex+Mono:wght@400;600&display=swap">

<div id="wrap">
  <canvas id="c" width="320" height="180" tabindex="0" aria-label="Haze Heroes game screen"></canvas>
  <div id="focus" hidden><span>CLICK TO PLAY</span></div>
</div>
<div id="pad" aria-label="Touch controls">
  <div class="minis"><span class="mini" data-k="pause">PAUSE</span><span class="mini" data-k="reroll">REROLL</span><span class="mini" id="fullBtn">FULL SCREEN</span></div>
  <div class="row">
    <div class="stick" id="stick"><div class="knob" id="knob"></div></div>
    <div class="btns">
      <div class="btn b-dash" data-k="dash">SIAM</div>
      <div class="btn b-act" data-k="act">E</div>
      <div class="btn b-sp" data-k="special">SPECIAL</div>
      <div class="btn b-atk" data-k="attack">ATTACK</div>
    </div>
  </div>
</div>
<div class="legend" aria-label="Controls">
  <span><b>Move</b> <kbd>WASD</kbd> / <kbd>Arrows</kbd></span>
  <span><b>Attack</b> <kbd>J</kbd> / left click</span>
  <span><b>Special</b> <kbd>K</kbd> / right click</span>
  <span><b>Siam (dash)</b> <kbd>Space</kbd></span>
  <span><b>Interact</b> <kbd>E</kbd> / <kbd>Enter</kbd></span>
  <span><b>Reroll power-ups</b> <kbd>R</kbd></span>
  <span><b>Pause</b> <kbd>P</kbd> / <kbd>Esc</kbd> / ‖ button</span>
  <span><b>Sound</b> <kbd>M</kbd></span>
  <span><button class="fsbtn" id="fsDesk" type="button">Full screen</button> <kbd>F</kbd></span>
</div>

<script src="src/config/game-config.js"></script>
<script src="src/data/game-data.js"></script>
<script src="src/core/save.js"></script>
<script src="src/core/audio.js"></script>
<script src="src/core/input.js"></script>
<script src="src/core/game-loop.js"></script>
<script src="src/entities/player.js"></script>
<script src="src/entities/enemies.js"></script>
<script src="src/entities/projectiles.js"></script>
<script src="src/entities/boss.js"></script>
<script src="src/weapons/fans.js"></script>
<script src="src/weapons/cyclone-vac.js"></script>
<script src="src/weapons/rotan.js"></script>
<script src="src/boons/boon-system.js"></script>
<script src="src/rooms/room-system.js"></script>
<script src="src/ui/ui-system.js"></script>
<script src="src/game.js"></script>

<script src="src/main.js"></script>
